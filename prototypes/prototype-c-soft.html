<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototype C — Soft Campus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Georgia", "Segoe UI", serif; background: #fff7ed; }
    .bar { background: #fb923c; color: white; padding: 12px 24px; font-size: 14px; }
    .bar a { color: #fff7ed; }
    .views { display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; justify-content: center; }
    .panel { border-radius: 24px; overflow: hidden; box-shadow: 0 8px 32px rgba(251,146,60,.15); }
    .label { text-align: center; padding: 12px; font-weight: 600; color: #9a3412; font-size: 13px; background: #ffedd5; }
    .login-wrap { width: 380px; padding: 40px; background: white; }
    .icon { width: 72px; height: 72px; background: #fed7aa; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px; }
    h1 { text-align: center; font-size: 26px; color: #431407; margin-bottom: 4px; font-family: "Segoe UI", sans-serif; }
    .hint { text-align: center; color: #a8a29e; font-size: 14px; margin-bottom: 28px; font-family: "Segoe UI", sans-serif; }
    input { width: 100%; padding: 16px 18px; border: 2px solid #fed7aa; border-radius: 999px; margin-bottom: 14px; font-size: 15px; font-family: "Segoe UI", sans-serif; }
    .btn { width: 100%; padding: 16px; background: #f97316; color: white; border: none; border-radius: 999px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: "Segoe UI", sans-serif; }
    .chat { width: 900px; height: 520px; display: flex; background: #fff7ed; font-family: "Segoe UI", sans-serif; }
    .side { width: 260px; background: white; margin: 12px; border-radius: 28px; padding: 20px; }
    .new { background: #f97316; color: white; border: none; width: 100%; padding: 14px; border-radius: 999px; font-weight: 700; margin-bottom: 16px; cursor: pointer; }
    .chat-item { padding: 12px 16px; border-radius: 999px; background: #ffedd5; color: #c2410c; font-size: 13px; margin-bottom: 8px; }
    .main { flex: 1; margin: 12px 12px 12px 0; display: flex; flex-direction: column; }
    .bubble-area { flex: 1; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .big { font-size: 30px; font-weight: 700; color: #431407; margin-bottom: 24px; }
    .chips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .chip { padding: 14px 22px; background: white; border: 2px solid #fed7aa; border-radius: 999px; font-size: 14px; color: #78350f; }
    .input-row { padding: 12px 20px; background: white; border-radius: 999px; margin: 0 0 12px 0; display: flex; gap: 12px; border: 2px solid #fed7aa; }
    .input-row input { flex: 1; border: none; background: transparent; padding: 10px; font-size: 15px; }
    .send { background: #f97316; color: white; border: none; padding: 12px 28px; border-radius: 999px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="bar">Prototype C — Soft Campus · <a href="index.html">← Back</a></div>
  <div class="views">
    <div>
      <div class="label">Login screen</div>
      <div class="panel login-wrap">
        <div class="icon">🌸</div>
        <h1>Hi there!</h1>
        <p class="hint">Your friendly campus helper</p>
        <input type="email" placeholder="Your email" />
        <input type="password" placeholder="Password" />
        <button class="btn">Let's go →</button>
      </div>
    </div>
    <div>
      <div class="label">Chat screen</div>
      <div class="panel chat">
        <div class="side">
          <h3 style="color:#c2410c;margin-bottom:12px;">Campus Buddy</h3>
          <button class="new">+ New question</button>
          <div class="chat-item">Scholarship help</div>
        </div>
        <div class="main">
          <div class="bubble-area">
            <div class="big">How can I help you today?</div>
            <div class="chips">
              <span class="chip">Fee details</span>
              <span class="chip">Exam dates</span>
              <span class="chip">Notices</span>
            </div>
          </div>
          <div class="input-row">
            <input placeholder="Ask me anything..." />
            <button class="send">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
